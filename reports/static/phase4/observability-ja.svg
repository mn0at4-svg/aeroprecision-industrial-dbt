ns-serif" font-size="15" fill="#c7d8e6" text-anchor="start"><tspan x="896" dy="0">trace・generation metadata</tspan><tspan x="896" dy="24">raw input/outputは保存しない</tspan></text><rect x="220" y="405" width="760" height="108" rx="16" fill="#241522" stroke="#fb7185" stroke-width="2"/><text x="600" y="440" font-family="Arial, Noto Sans JP, sans-serif" font-size="20" font-weight="500" fill="#fecdd3" text-anchor="middle">送信しない情報</text><text x="600" y="470" font-family="Arial, Noto Sans JP, sans-serif" font-size="15" font-weight="400" fill="#ffe4e6" text-anchor="middle">raw promptなし</text><text x="600" y="490" font-family="Arial, Noto Sans JP, sans-serif" font-size="15" font-weight="400" fill="#ffe4e6" text-anchor="middle">raw LLM outputなし</text><text x="600" y="510" font-family="Arial, Noto Sans JP, sans-serif" font-size="15" font-weight="400" fill="#ffe4e6" text-anchor="middle">credentialsなし</text><text x="600" y="364" font-family="Arial, Noto Sans JP, sans-serif" font-size="16" font-weight="400" fill="#a9c3d6" text-anchor="middle">L0/L1 synthetic data only</text>
