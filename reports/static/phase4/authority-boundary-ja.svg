<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">製造業RFQ見積自動化の権限境界</title>
<desc id="desc">財務上の権限は決定論的ロジックとHuman Approvalに残す。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#57d2ff"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="24" fill="#08111f"/>
<text x="56" y="58" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="29" font-weight="500" fill="#f4fbff" text-anchor="start">製造業RFQ見積自動化の権限境界</text>
<text x="56" y="92" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="17" font-weight="400" fill="#a9c3d6" text-anchor="start">財務上の権限は決定論的ロジックとHuman Approvalに残す。</text>
<rect x="45" y="135" width="210" height="150" rx="18" fill="#10263a" stroke="#284158" stroke-width="2"/>
<rect x="45" y="135" width="10" height="150" rx="5" fill="#38bdf8"/>
<text x="75" y="185" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="20" font-weight="500" fill="#f4fbff" text-anchor="start">RFQ入力検証</text>
<text x="75" y="222" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="start">合成L0/L1</text>
<text x="75" y="252" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="start">既知の製品ID</text>
<rect x="325" y="135" width="210" height="150" rx="18" fill="#10263a" stroke="#284158" stroke-width="2"/>
<rect x="325" y="135" width="10" height="150" rx="5" fill="#2dd4bf"/>
<text x="355" y="185" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="20" font-weight="500" fill="#f4fbff" text-anchor="start">決定論的な財務</text>
<text x="355" y="222" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="start">原価・粗利率</text>
<text x="355" y="252" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="start">CFO最低価格</text>
<rect x="605" y="135" width="210" height="150" rx="18" fill="#10263a" stroke="#284158" stroke-width="2"/>
<rect x="605" y="135" width="10" height="150" rx="5" fill="#fbbf24"/>
<text x="635" y="185" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="20" font-weight="500" fill="#f4fbff" text-anchor="start">上限付きLLM</text>
<text x="635" y="222" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="start">説明補助だけ</text>
<text x="635" y="252" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="start">価格・承認は不可</text>
<rect x="885" y="135" width="210" height="150" rx="18" fill="#10263a" stroke="#284158" stroke-width="2"/>
<rect x="885" y="135" width="10" height="150" rx="5" fill="#a78bfa"/>
<text x="915" y="185" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="20" font-weight="500" fill="#f4fbff" text-anchor="start">出力の再検証</text>
<text x="915" y="222" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="start">契約チェック</text>
<text x="915" y="252" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="start">最大3回</text>
<rect x="1165" y="135" width="210" height="150" rx="18" fill="#10263a" stroke="#284158" stroke-width="2"/>
<rect x="1165" y="135" width="10" height="150" rx="5" fill="#34d399"/>
<text x="1195" y="185" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="20" font-weight="500" fill="#f4fbff" text-anchor="start">Human Approval</text>
<text x="1195" y="222" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="start">保存・通知・送信</text>
<text x="1195" y="252" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="start">承認後だけ</text>
<path d="M 255 210 L 308 210" stroke="#57d2ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M 535 210 L 588 210" stroke="#57d2ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M 815 210 L 868 210" stroke="#57d2ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M 1095 210 L 1148 210" stroke="#57d2ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M 430 360 L 430 307" stroke="#57d2ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="270" y="360" width="320" height="130" rx="18" fill="#10263a" stroke="#284158" stroke-width="2"/>
<rect x="270" y="360" width="10" height="130" rx="5" fill="#38bdf8"/>
<text x="300" y="415" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="21" font-weight="500" fill="#f4fbff" text-anchor="start">read-only製品マスタ</text>
<text x="300" y="450" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="start">BigQuery</text>
<rect x="45" y="545" width="1330" height="45" rx="18" fill="#10263a" stroke="#284158" stroke-width="2"/>
<text x="700" y="575" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="middle">LLMは原価、粗利率、価格、承認、却下を決定できません。</text>
</svg>