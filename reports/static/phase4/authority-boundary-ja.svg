<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">製造業RFQ見積自動化の権限境界</title>
<desc id="desc">製造業RFQ見積自動化の権限境界</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#57d2ff"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="24" fill="#08111f"/>
<text x="56" y="54" font-family="Arial, Noto Sans JP, sans-serif" font-size="28" font-weight="500" fill="#f4fbff" text-anchor="start">製造業RFQ見積自動化の権限境界</text><text x="56" y="86" font-family="Arial, Noto Sans JP, sans-serif" font-size="17" font-weight="400" fill="#a9c3d6" text-anchor="start">財務上の権限は決定論的ロジックとHuman Approvalに残す</text><rect x="45" y="150" width="190" height="128" rx="16" fill="#10263a" stroke="#284158" stroke-width="2"/><rect x="45" y="150" width="10" height="128" rx="5" fill="#38bdf8"/><text x="71" y="188" font-family="Arial, Noto Sans JP, sans-serif" font-size="18" font-weight="500" fill="#f4fbff" text-anchor="start">RFQ入力検証</text><text x="71" y="220" font-family="Arial, Noto Sans JP, sans-serif" font-size="15" fill="#c7d8e6" text-anchor="start"><tspan x="71" dy="0">合成L0/L1</tspan><tspan x="71" dy="24">既知の製品ID</tspan></text><path d="M235 214 L261 214" stroke="#57d2ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="275" y="150" width="190" height="128" rx="16" fill="#10263a" stroke="#284158" stroke-width="2"/><rect x="275" y="150" width="10" height="128" rx="5" fill="#2dd4bf"/><text x="301" y="188" font-family="Arial, Noto Sans JP, sans-serif" font-size="18" font-weight="500" fill="#f4fbff" text-anchor="start">決定論的な財務</text><text x="301" y="220" font-family="Arial, Noto Sans JP, sans-serif" font-size="15" fill="#c7d8e6" text-anchor="start"><tspan x="301" dy="0">原価・粗利率</tspan><tspan x="301" dy="24">CFO最低価格</tspan></text><path d="M465 214 L491 214" stroke="#57d2ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="505" y="150" width="190" height="128" rx="16" fill="#10263a" stroke="#284158" stroke-width="2"/><rect x="505" y="150" width="10" height="128" rx="5" fill="#fbbf24"/><text x="531" y="188" font-family="Arial, Noto Sans JP, sans-serif" font-size="18" font-weight="500" fill="#f4fbff" text-anchor="start">上限付きLLM</text><text x="531" y="220" font-family="Arial, Noto Sans JP, sans-serif" font-size="15" fill="#c7d8e6" text-anchor="start"><tspan x="531" dy="0">説明補助だけ</tspan><tspan x="531" dy="24">価格・承認は不可</tspan></text><path d="M695 214 L721 214" stroke="#57d2ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="735" y="150" width="190" height="128" rx="16" fill="#10263a" stroke="#284158" stroke-width="2"/><rect x="735" y="150" width="10" height="128" rx="5" fill="#a78bfa"/><text x="761" y="188" font-family="Arial, Noto Sans JP, sans-serif" font-size="18" font-weight="500" fill="#f4fbff" text-anchor="start">出力の再検証</text><text x="761" y="220" font-family="Arial, Noto Sans JP, sans-serif" font-size="15" fill="#c7d8e6" text-anchor="start"><tspan x="761" dy="0">契約チェック</tspan><tspan x="761" dy="24">最大3回</tspan></text><path d="M925 214 L951 214" stroke="#57d2ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="965" y="150" width="190" height="128" rx="16" fill="#10263a" stroke="#284158" stroke-width="2"/><rect x="965" y="150" width="10" height="128" rx="5" fill="#34d399"/><text x="991" y="188" font-family="Arial, Noto Sans JP, sans-serif" font-size="18" font-weight="500" fill="#f4fbff" text-anchor="start">Human Approval</text><text x="991" y="220" font-family="Arial, Noto Sans JP, sans-serif" font-size="15" fill="#c7d8e6" text-anchor="start"><tspan x="991" dy="0">保存・通知・送信</tspan><tspan x="991" dy="24">承認後だけ</tspan></text><rect x="275" y="350" width="280" height="94" rx="16" fill="#10263a" stroke="#284158" stroke-width="2"/><rect x="275" y="350" width="10" height="94" rx="5" fill="#38bdf8"/><text x="301" y="388" font-family="Arial, Noto Sans JP, sans-serif" font-size="18" font-weight="500" fill="#f4fbff" text-anchor="start">read-only製品マスタ</text><text x="301" y="420" font-family="Arial, Noto Sans JP, sans-serif" font-size="15" fill="#c7d8e6" text-anchor="start"><tspan x="301" dy="0">BigQuery</tspan></text><path d="M415 350 L415 292" stroke="#38bdf8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="45" y="490" width="1100" height="44" rx="16" fill="#10263a" stroke="#284158" stroke-width="2"/><text x="595" y="519" font-family="Arial, Noto Sans JP, sans-serif" font-size="16" font-weight="400" fill="#d4e7f5" text-anchor="middle">LLMは原価、粗利率、価格、承認、却下を決定できません。</text>
</svg>