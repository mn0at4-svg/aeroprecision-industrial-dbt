<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
<title id="title">上限付きリトライとfail-closed制御</title>
<desc id="desc">上限付きリトライとfail-closed制御</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#57d2ff"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="24" fill="#08111f"/>
<text x="56" y="54" font-family="Arial, Noto Sans JP, sans-serif" font-size="28" font-weight="500" fill="#f4fbff" text-anchor="start">上限付きリトライとfail-closed制御</text><text x="56" y="86" font-family="Arial, Noto Sans JP, sans-serif" font-size="17" font-weight="400" fill="#a9c3d6" text-anchor="start">出力は毎回検証し、4回目の呼び出しは行いません。</text><rect x="110" y="145" width="250" height="90" rx="16" fill="#10263a" stroke="#284158" stroke-width="2"/><rect x="110" y="145" width="10" height="90" rx="5" fill="#fbbf24"/><text x="136" y="183" font-family="Arial, Noto Sans JP, sans-serif" font-size="18" font-weight="500" fill="#f4fbff" text-anchor="start">1回目</text><text x="136" y="215" font-family="Arial, Noto Sans JP, sans-serif" font-size="15" fill="#c7d8e6" text-anchor="start"><tspan x="136" dy="0">LLMによる説明補助</tspan><tspan x="136" dy="24">L0/L1のみ</tspan></text><path d="M235 235 L235 285" stroke="#57d2ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="110" y="300" width="250" height="78" rx="16" fill="#10263a" stroke="#284158" stroke-width="2"/><rect x="110" y="300" width="10" height="78" rx="5" fill="#a78bfa"/><text x="136" y="338" font-family="Arial, Noto Sans JP, sans-serif" font-size="18" font-weight="500" fill="#f4fbff" text-anchor="start">検証済み</text><text x="136" y="370" font-family="Arial, Noto Sans JP, sans-serif" font-size="15" fill="#c7d8e6" text-anchor="start"><tspan x="136" dy="0">出力契約を検証</tspan></text><path d="M360 339 L439 339" stroke="#fbbf24" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="399.5" y="323" font-family="Arial, Noto Sans JP, sans-serif" font-size="14" font-weight="500" fill="#fbbf24" text-anchor="middle">再試行</text><rect x="455" y="145" width="250" height="90" rx="16" fill="#10263a" stroke="#284158" stroke-width="2"/><rect x="455" y="145" width="10" height="90" rx="5" fill="#fbbf24"/><text x="481" y="183" font-family="Arial, Noto Sans JP, sans-serif" font-size="18" font-weight="500" fill="#f4fbff" text-anchor="start">2回目</text><text x="481" y="215" font-family="Arial, Noto Sans JP, sans-serif" font-size="15" fill="#c7d8e6" text-anchor="start"><tspan x="481" dy="0">LLMによる説明補助</tspan><tspan x="481" dy="24">L0/L1のみ</tspan></text><path d="M580 235 L580 285" stroke="#57d2ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="455" y="300" width="250" height="78" rx="16" fill="#10263a" stroke="#284158" stroke-width="2"/><rect x="455" y="300" width="10" height="78" rx="5" fill="#a78bfa"/><text x="481" y="338" font-family="Arial, Noto Sans JP, sans-serif" font-size="18" font-weight="500" fill="#f4fbff" text-anchor="start">検証済み</text><text x="481" y="370" font-family="Arial, Noto Sans JP, sans-serif" font-size="15" fill="#c7d8e6" text-anchor="start"><tspan x="481" dy="0">出力契約を検証</tspan></text><path d="M705 339 L784 339" stroke="#fbbf24" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="744.5" y="323" font-family="Arial, Noto Sans JP, sans-serif" font-size="14" font-weight="500" fill="#fbbf24" text-anchor="middle">再試行</text><rect x="800" y="145" width="250" height="90" rx="16" fill="#10263a" stroke="#284158" stroke-width="2"/><rect x="800" y="145" width="10" height="90" rx="5" fill="#fbbf24"/><text x="826" y="183" font-family="Arial, Noto Sans JP, sans-serif" font-size="18" font-weight="500" fill="#f4fbff" text-anchor="start">3回目</text><text x="826" y="215" font-family="Arial, Noto Sans JP, sans-serif" font-size="15" fill="#c7d8e6" text-anchor="start"><tspan x="826" dy="0">LLMによる説明補助</tspan><tspan x="826" dy="24">L0/L1のみ</tspan></text><path d="M925 235 L925 285" stroke="#57d2ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="800" y="300" width="250" height="78" rx="16" fill="#10263a" stroke="#284158" stroke-width="2"/><rect x="800" y="300" width="10" height="78" rx="5" fill="#a78bfa"/><text x="826" y="338" font-family="Arial, Noto Sans JP, sans-serif" font-size="18" font-weight="500" fill="#f4fbff" text-anchor="start">検証済み</text><text x="826" y="370" font-family="Arial, Noto Sans JP, sans-serif" font-size="15" fill="#c7d8e6" text-anchor="start"><tspan x="826" dy="0">出力契約を検証</tspan></text><path d="M235 378 L235 446" stroke="#34d399" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="92" y="460" width="286" height="74" rx="16" fill="#10263a" stroke="#284158" stroke-width="2"/><rect x="92" y="460" width="10" height="74" rx="5" fill="#34d399"/><text x="118" y="498" font-family="Arial, Noto Sans JP, sans-serif" font-size="18" font-weight="500" fill="#f4fbff" text-anchor="start">Human Approval</text><text x="118" y="530" font-family="Arial, Noto Sans JP, sans-serif" font-size="15" fill="#c7d8e6" text-anchor="start"><tspan x="118" dy="0">検証済み出力の後だけ</tspan></text><path d="M925 378 L925 446" stroke="#fb7185" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="670" y="460" width="510" height="74" rx="16" fill="#10263a" stroke="#284158" stroke-width="2"/><rect x="670" y="460" width="10" height="74" rx="5" fill="#fb7185"/><text x="696" y="498" font-family="Arial, Noto Sans JP, sans-serif" font-size="18" font-weight="500" fill="#f4fbff" text-anchor="start">FAIL CLOSED</text><text x="696" y="530" font-family="Arial, Noto Sans JP, sans-serif" font-size="15" fill="#c7d8e6" text-anchor="start"><tspan x="696" dy="0">承認なし・保存なし・外部操作なし</tspan></text>
</svg>