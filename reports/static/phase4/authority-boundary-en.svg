<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
<title id="title">Authority boundary for manufacturing RFQ automation</title>
<desc id="desc">Financial authority stays deterministic and human controlled.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#57d2ff"/>
  </marker>
</defs>
<rect width="100%" height="100%" rx="24" fill="#08111f"/>
<text x="56" y="58" font-family="Arial, sans-serif" font-size="29" font-weight="500" fill="#f4fbff" text-anchor="start">Authority boundary for manufacturing RFQ automation</text>
<text x="56" y="92" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#a9c3d6" text-anchor="start">Financial authority stays deterministic and human controlled.</text>
<rect x="45" y="135" width="210" height="150" rx="18" fill="#10263a" stroke="#284158" stroke-width="2"/>
<rect x="45" y="135" width="10" height="150" rx="5" fill="#38bdf8"/>
<text x="75" y="185" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#f4fbff" text-anchor="start">RFQ validation</text>
<text x="75" y="222" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="start">Synthetic L0/L1</text>
<text x="75" y="252" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="start">Known product ID</text>
<rect x="325" y="135" width="210" height="150" rx="18" fill="#10263a" stroke="#284158" stroke-width="2"/>
<rect x="325" y="135" width="10" height="150" rx="5" fill="#2dd4bf"/>
<text x="355" y="178" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#f4fbff" text-anchor="start">Deterministic</text>
<text x="355" y="202" font-family="Arial, sans-serif" font-size="18" font-weight="500" fill="#f4fbff" text-anchor="start">finance</text>
<text x="355" y="236" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="start">Cost and margin</text>
<text x="355" y="262" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="start">CFO minimum price</text>
<rect x="605" y="135" width="210" height="150" rx="18" fill="#10263a" stroke="#284158" stroke-width="2"/>
<rect x="605" y="135" width="10" height="150" rx="5" fill="#fbbf24"/>
<text x="635" y="185" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#f4fbff" text-anchor="start">Bounded LLM</text>
<text x="635" y="222" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="start">Explanation only</text>
<text x="635" y="252" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="start">No price or approval</text>
<rect x="885" y="135" width="210" height="150" rx="18" fill="#10263a" stroke="#284158" stroke-width="2"/>
<rect x="885" y="135" width="10" height="150" rx="5" fill="#a78bfa"/>
<text x="915" y="185" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#f4fbff" text-anchor="start">Output validation</text>
<text x="915" y="222" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="start">Contract checks</text>
<text x="915" y="252" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="start">Maximum 3 attempts</text>
<rect x="1165" y="135" width="210" height="150" rx="18" fill="#10263a" stroke="#284158" stroke-width="2"/>
<rect x="1165" y="135" width="10" height="150" rx="5" fill="#34d399"/>
<text x="1195" y="185" font-family="Arial, sans-serif" font-size="20" font-weight="500" fill="#f4fbff" text-anchor="start">Human Approval</text>
<text x="1195" y="222" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="start">Save, notify, send</text>
<text x="1195" y="252" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="start">Only after approval</text>
<path d="M 255 210 L 308 210" stroke="#57d2ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M 535 210 L 588 210" stroke="#57d2ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M 815 210 L 868 210" stroke="#57d2ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M 1095 210 L 1148 210" stroke="#57d2ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<path d="M 430 360 L 430 307" stroke="#57d2ff" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
<rect x="270" y="360" width="320" height="130" rx="18" fill="#10263a" stroke="#284158" stroke-width="2"/>
<rect x="270" y="360" width="10" height="130" rx="5" fill="#38bdf8"/>
<text x="300" y="415" font-family="Arial, sans-serif" font-size="21" font-weight="500" fill="#f4fbff" text-anchor="start">Read-only product master</text>
<text x="300" y="450" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="start">BigQuery</text>
<rect x="45" y="545" width="1330" height="45" rx="18" fill="#10263a" stroke="#284158" stroke-width="2"/>
<text x="700" y="575" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#c7d8e6" text-anchor="middle">The model cannot calculate cost, margin, price, approval, or rejection.</text>
</svg>